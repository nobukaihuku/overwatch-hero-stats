name: Fetch hero stats (daily)

on:
  schedule:
    - cron: "0 3 * * *"   # 毎日 03:00 UTC (= 12:00 JST)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hero-stats
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STATS_FETCH_DELAY_MS: "1000"   # 公式サイトへの礼儀: 1req/秒
      STATS_OUT_DIR: "hero-stats"    # このリポジトリでは hero-stats/ に出力
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Fetch hero stats
        run: npm run stats:fetch
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-stats/
          if git diff --staged --quiet; then
            echo "差分なし — コミットをスキップ"
          else
            if [ "${GITHUB_REF_TYPE:-}" != "branch" ]; then
              echo "::error::スナップショットの保存先はbranch refのみ対応しています。"
              exit 1
            fi
            git commit -m "chore(stats): hero stats snapshot $(date -u +%Y-%m-%d)"
            # schedule は main、workflow_dispatch は選択された ref へ戻す。
            # 収集中の同一ブランチへのpush競合は、rebaseを中断・復旧して最大3回リトライする。
            branch="${GITHUB_REF_NAME:?GITHUB_REF_NAME is required}"
            pushed=false
            for i in 1 2 3; do
              if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
                pushed=true
                break
              fi
              git rebase --abort || true
              echo "push 競合。rebase 後リトライ ($i/3)"
              if [ "$i" -lt 3 ]; then
                sleep 5
              fi
            done
            if [ "$pushed" != true ]; then
              echo "::error::スナップショットを ${branch} にpushできませんでした。"
              exit 1
            fi
          fi
